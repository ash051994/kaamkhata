name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests
        run: node tests/unit.mjs
      - name: Browser smoke test
        run: |
          npm install --no-save --legacy-peer-deps --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 --directory www &
          sleep 2
          node tests/smoke.mjs

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Capacitor
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: App icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1C2A3A' --iconBackgroundColorDark '#0F141A' --splashBackgroundColor '#1C2A3A' --splashBackgroundColorDark '#0F141A'
        continue-on-error: true

      - name: Microphone permission and version
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO "$MANIFEST" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n    </queries>#' "$MANIFEST"
          VERSION_NAME=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -n "RECORD_AUDIO\|versionCode\|versionName" "$MANIFEST" android/app/build.gradle

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release (when signing secrets are set)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/release.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm app/release.jks

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/KaamKhata-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/KaamKhata-release.aab 2>/dev/null || true
          cp android/app/build/outputs/apk/release/app-release.apk out/KaamKhata-release.apk 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: KaamKhata-android
          path: out/

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
